name: ViaCoder native platforms
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platforms to validate
        type: choice
        options: [all, windows, types]
        default: all
      typecheck:
        description: Include type checking in a Windows-only follow-up
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: viacoder-native-${{ github.ref }}
  cancel-in-progress: false
jobs:
  native:
    if: ${{ inputs.platform != 'types' }}
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.platform == 'windows' && '{"include":[{"runner":"windows-2025","target":"win32-x64"},{"runner":"windows-11-arm","target":"win32-arm64"}]}' || '{"include":[{"runner":"ubuntu-24.04","target":"linux-x64"},{"runner":"ubuntu-24.04-arm","target":"linux-arm64"},{"runner":"macos-15-intel","target":"darwin-x64"},{"runner":"macos-15","target":"darwin-arm64"},{"runner":"windows-2025","target":"win32-x64"},{"runner":"windows-11-arm","target":"win32-arm64"}]}') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Frozen development dependencies
        run: bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - name: Native runner identity
        run: bun --no-env-file --config=packaging/runtime.bunfig.toml scripts/ci/native-platform.mjs facts '${{ matrix.target }}'
      - name: Offline Web and interaction fixtures
        run: bun --no-env-file --config=packaging/runtime.bunfig.toml scripts/ci/native-platform.mjs tests '${{ matrix.target }}'
      - name: Physical native installation and public launcher
        if: ${{ !cancelled() }}
        run: bun --no-env-file --config=packaging/runtime.bunfig.toml scripts/ci/native-platform.mjs install '${{ matrix.target }}'
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: acceptance-${{ matrix.target }}
          path: ci-results/*.json
          if-no-files-found: warn
          retention-days: 7
  types:
    if: ${{ inputs.platform != 'windows' || inputs.typecheck }}
    name: Published snapshot type check (original tsconfig)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: bun install --frozen-lockfile --ignore-scripts --registry=https://registry.npmjs.org
      - run: node --max-old-space-size=8192 node_modules/typescript/bin/tsc --noEmit --project tsconfig.json
